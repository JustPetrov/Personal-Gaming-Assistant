services:
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "src/scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro

  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "dashboard:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      - scheduler

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama:
