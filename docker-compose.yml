services:
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "src/scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      ollama:
        condition: service_healthy

  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "dashboard:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    volumes:
      - ollama:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  ollama:
